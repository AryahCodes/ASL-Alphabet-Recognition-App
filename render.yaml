services:
  - type: web
    name: signapp-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    envVars:
      - key: SIGNAPP_INFERENCE_BACKEND
        value: numpy
      - key: SIGNAPP_CORS_ORIGINS
        value: https://signapp-frontend.vercel.app
